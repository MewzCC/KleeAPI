name: Windows portable release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match package.json version.' }
      - name: Run offline tests
        run: npm test
      - name: Build portable ZIP
        run: npm run release:win
      - name: Test extracted package without system Node
        run: npm run release:verify
      - name: Upload clean release files
        uses: actions/upload-artifact@v4
        with:
          name: KleeAPI-windows-x64
          path: |
            output/releases/*.zip
            output/releases/*.sha256
          if-no-files-found: error
          retention-days: 30
